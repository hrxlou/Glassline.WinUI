name: Windows build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contract
        shell: pwsh
        run: ./eng/scripts/validate-repository.ps1
      - name: Validate Theme resource contract
        shell: pwsh
        run: ./eng/scripts/validate-theme.ps1

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore Glassline.WinUI.sln -p:Platform=${{ matrix.platform }}
      - name: Build
        shell: pwsh
        run: dotnet build Glassline.WinUI.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

  pack:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack shipping libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/Glassline.WinUI.Theme/Glassline.WinUI.Theme.csproj -c Release -p:Platform=x64 -o artifacts/packages
          dotnet pack src/Glassline.WinUI.Controls/Glassline.WinUI.Controls.csproj -c Release -p:Platform=x64 -o artifacts/packages
          dotnet pack src/Glassline.WinUI.Effects/Glassline.WinUI.Effects.csproj -c Release -p:Platform=x64 -o artifacts/packages
      - name: Verify package contents
        shell: pwsh
        run: |
          $forbidden = @('*.ttf','*.otf','*.ttc','*.sketch','*.fig')
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            $dir = Join-Path $env:RUNNER_TEMP $_.BaseName
            Expand-Archive $_.FullName -DestinationPath $dir -Force
            foreach ($pattern in $forbidden) {
              if (Get-ChildItem $dir -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue) {
                throw "Forbidden asset found in $($_.Name): $pattern"
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
