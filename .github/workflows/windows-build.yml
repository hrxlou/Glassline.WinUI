name: Windows build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contract
        shell: pwsh
        run: ./eng/scripts/validate-repository.ps1
      - name: Validate Theme resource contract
        shell: pwsh
        run: ./eng/scripts/validate-theme.ps1
      - name: Validate Controls static/template contract
        shell: pwsh
        run: ./eng/scripts/validate-controls.ps1
      - name: Validate material runtime contract
        shell: pwsh
        run: ./eng/scripts/validate-materials.ps1
      - name: Validate Gallery deterministic contract
        shell: pwsh
        run: ./eng/scripts/validate-gallery.ps1
      - name: Validate public research corpus contract
        shell: pwsh
        run: ./eng/scripts/validate-corpus.ps1
      - name: Validate documentation navigation links
        shell: pwsh
        run: ./eng/scripts/validate-doc-links.ps1

  material-policy-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Execute deterministic material policy cases
        shell: pwsh
        run: dotnet run --project tests/Glassline.MaterialPolicySmoke/Glassline.MaterialPolicySmoke.csproj -c Release
      - name: Execute deterministic Gallery scene-selection cases
        shell: pwsh
        run: dotnet run --project tests/Glassline.GallerySceneSmoke/Glassline.GallerySceneSmoke.csproj -c Release
      - name: Execute deterministic benchmark-data cases
        shell: pwsh
        run: dotnet run --project tests/Glassline.BenchmarkDataSmoke/Glassline.BenchmarkDataSmoke.csproj -c Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore Glassline.WinUI.sln -p:Platform=${{ matrix.platform }}
      - name: Build
        shell: pwsh
        run: dotnet build Glassline.WinUI.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

  pack:
    runs-on: windows-latest
    needs: [build, material-policy-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack shipping libraries with package validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/Glassline.WinUI.Theme/Glassline.WinUI.Theme.csproj -c Release -p:Platform=x64 -o artifacts/packages
          dotnet pack src/Glassline.WinUI.Controls/Glassline.WinUI.Controls.csproj -c Release -p:Platform=x64 -o artifacts/packages
          dotnet pack src/Glassline.WinUI.Effects/Glassline.WinUI.Effects.csproj -c Release -p:Platform=x64 -o artifacts/packages
      - name: Verify package contents
        shell: pwsh
        run: |
          $forbidden = @('*.ttf','*.otf','*.ttc','*.sketch','*.fig')
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            $dir = Join-Path $env:RUNNER_TEMP $_.BaseName
            Expand-Archive $_.FullName -DestinationPath $dir -Force
            foreach ($pattern in $forbidden) {
              if (Get-ChildItem $dir -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue) {
                throw "Forbidden asset found in $($_.Name): $pattern"
              }
            }
          }
      - name: Validate generated NuGet metadata and dependency boundaries
        shell: pwsh
        run: ./eng/scripts/validate-package-metadata.ps1 -PackageDirectory artifacts/packages
      - name: Build NuGet package consumer smoke app
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path artifacts/packages).Path
          $nugetConfig = Join-Path $env:RUNNER_TEMP 'Glassline.PackageSmoke.NuGet.config'
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="glassline-local" value="$packageSource" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Path $nugetConfig -Encoding utf8
          dotnet restore tests/Glassline.PackageSmoke/Glassline.PackageSmoke.csproj -p:Platform=x64 --configfile $nugetConfig
          dotnet build tests/Glassline.PackageSmoke/Glassline.PackageSmoke.csproj -c Release -p:Platform=x64 --no-restore
      - name: Generate and validate SPDX SBOM
        shell: pwsh
        run: |
          $drop = Join-Path $PWD 'artifacts/sbom-drop'
          $validationDir = Join-Path $PWD 'artifacts/sbom-validation'
          New-Item -ItemType Directory -Force $drop | Out-Null
          New-Item -ItemType Directory -Force $validationDir | Out-Null
          Copy-Item artifacts/packages/*.nupkg $drop
          Copy-Item LICENSE $drop
          Copy-Item THIRD-PARTY-NOTICES $drop

          $toolDir = Join-Path $env:RUNNER_TEMP 'glassline-sbom-tool'
          dotnet tool install Microsoft.Sbom.DotNetTool --version 4.1.5 --tool-path $toolDir
          $sbomTool = Join-Path $toolDir 'sbom-tool.exe'
          & $sbomTool generate -b $drop -bc $PWD -pn Glassline.WinUI -pv 0.1.0-preview.1 -ps 'Glassline.WinUI contributors' -nsb 'https://github.com/hrxlou/Glassline.WinUI/sbom'
          & $sbomTool validate -b $drop -o (Join-Path $validationDir 'result.json') -mi SPDX:2.2
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-and-sbom
          path: |
            artifacts/packages/*.nupkg
            artifacts/sbom-drop/_manifest/**
            artifacts/sbom-validation/**
